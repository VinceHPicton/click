services:
  dbserver:
    build:
      dockerfile: ./build/dbserver.dockerfile
      args:
        DB_BASE_IMAGE: postgres:16.1
    image: click/dbserver
    container_name: click-dbserver
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432
    networks:
      - local

  pgadmin:
    build:
      dockerfile: ./build/pgadmin.dockerfile
      args:
        PGADMIN_SERVERS_FILENAME: pgadmin_servers.json
        PGADMIN_BASE_IMAGE: dpage/pgadmin4:latest
    image: click/pgadmin
    container_name: click-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_PORT}
    ports:
      - ${PGADMIN_PORT}:${PGADMIN_PORT}
    depends_on:
      dbserver:
        condition: service_started
    networks:
      - local

  goapp:
    build:
      context: .
      dockerfile: ./build/goapp.dockerfile
      args:
        GOAPP_BASE_IMAGE: golang:1.26
    image: click/goapp
    container_name: click-goapp
    environment:
      APP_NAME: goapp
      DB_ADDR: dbserver
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GOAPP_PORT: ${GOAPP_PORT}
    ports:
      - ${GOAPP_PORT}:${GOAPP_PORT}
    command: /usr/bin/goapp
    depends_on:
      dbserver:
        condition: service_started
    networks:
      - local

networks:
  local:
    name: click_network
